# Builds the tool image the release workflow runs in (ci/builder/Dockerfile) and pushes it to ghcr.io.
# Runs when the Dockerfile changes (on any branch, so a pull request can bring its own builder) or by hand.
name: Builder image

on:
  push:
    paths: ['ci/builder/**', '.github/workflows/builder-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/boot-trs80-4p-builder

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ci/builder
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
